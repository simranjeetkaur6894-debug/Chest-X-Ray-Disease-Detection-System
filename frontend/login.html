
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Chest X-Ray Disease Detection</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div class="auth-background">
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <div class="auth-container">

            <div class="auth-brand">
                <div class="brand-icon">✚</div>
                <h1>Chest X-Ray</h1>
                <p>AI Disease Detection System</p>
            </div>

            <div class="auth-card">
                <span class="auth-label">WELCOME BACK</span>
                <h2>Sign In</h2>
                <p class="auth-description">
                    Login to access your medical AI workspace.
                </p>

                <form id="loginForm">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button type="submit" class="auth-button">
                        Login to Account →
                    </button>
                </form>

                <p class="auth-switch">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

                <a href="index.html" class="back-home">
                    ← Back to Landing Page
                </a>
            </div>

            <p class="auth-footer">
                AI-powered educational chest X-ray classification
            </p>

        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
